# Verification Contract 설정 (프로젝트 소유)
# .harness/verify 가 이 파일을 source 한다. POSIX sh 문법.
#
# QUICK_CMD : 구현 중 빠른 검증 (변경 범위만, 수 초~수 분)
# FULL_CMD  : 완료 전 전체 검증 (build + 전체 테스트 + lint/static analysis)
# 범위 지정: `.harness/verify quick <scope>` 의 scope 가 $VERIFY_SCOPE 로 전달된다 (비어 있으면 전체).
# VERIFY_TIMEOUT : 초 단위 시간 제한 (선택, `timeout` 명령이 있을 때만 적용)
#
# 성공 = 명령의 exit code 0. 명령이 비어 있으면 NOT_CONFIGURED (exit 2) — 통과로 취급하지 않는다.

QUICK_CMD=""
FULL_CMD=""
VERIFY_TIMEOUT=1800

# ---- 예시 (주석 해제 후 사용) ----
# Gradle (Kotlin/Java/Spring/Android):
#   QUICK_CMD='./gradlew ${VERIFY_SCOPE:+$VERIFY_SCOPE:}test'      # scope 예: :app
#   FULL_CMD='./gradlew build'                                      # build 에 test/lint(detekt, ktlint 등) 연결
# npm:
#   QUICK_CMD='npm test --silent'
#   FULL_CMD='npm run lint && npm test && npm run build'
# Python:
#   QUICK_CMD='pytest -x -q ${VERIFY_SCOPE}'
#   FULL_CMD='ruff check . && pytest -q'
# make:
#   QUICK_CMD='make test'  FULL_CMD='make ci'
